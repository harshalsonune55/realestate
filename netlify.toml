# Al Manara PMS on Netlify — the web tier only.
#
# Same shape as render.yaml: the data tier does not move. Postgres and Odoo
# stay on the AWS box (16.170.201.73), which also keeps serving the app at
# /pms for the mobile client. Netlify becomes a second front end onto the
# same database.
#
# The Next.js adapter (opennextjs-netlify) is applied automatically — do not
# add it to [[plugins]] or install it, or you pin a version that will rot.
# SSR/route handlers become Netlify Functions; src/middleware.ts becomes an
# Edge Function.

[build]
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  # NODE_VERSION is the one variable that genuinely belongs here: it is
  # consumed by the build image itself, before any of our code runs.
  # .node-version already says 22.18.0 and Netlify honours it; this keeps the
  # version visible alongside the rest of the build config.
  NODE_VERSION = "22.18.0"

# Everything the *running* app reads is deliberately NOT in this file.
#
# [build.environment] is build-scoped: Netlify exposes it to the build image
# and nowhere else. Functions and Edge Functions read the site's environment
# variables instead, so anything listed here is simply invisible to
# process.env at request time. Putting ASSISTANT_PROVIDER here is what makes
# src/lib/llm.ts report "The assistant is not configured" — it sees no pinned
# provider at all, rather than a pinned provider with a missing key.
#
# So all of these go in Site configuration → Environment variables, scoped to
# Functions (see deploy/NETLIFY.md for the full table):
#
#   DATABASE_URL   DATABASE_SSL   ODOO_URL       ODOO_DB
#   ODOO_USERNAME  ODOO_API_KEY   GROQ_API_KEY   ASSISTANT_PROVIDER
#   PMS_API_TOKEN  PMS_ACCESS_PASSWORD
#
# Two variables are deliberately absent everywhere, and setting either breaks
# this deploy:
#
#   PMS_BASE_PATH — Netlify serves this site at the root of its own hostname.
#                   Set it and every asset 404s and the app renders unstyled.
#
#   PMS_DATA_DIR  — the JSON demo store's path. Netlify Functions have a
#                   read-only filesystem, so there is nothing for it to do.
